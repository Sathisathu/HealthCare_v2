<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h1 class="brand">MedConnect <span class="portal-badge">Admin Portal</span></h1>
            <p>Secure Access for Administrators</p>
        </div>

        <form (ngSubmit)="onLogin()" #loginForm="ngForm">
            <div class="form-group">
                <label for="email">Admin Email</label>
                <input type="email" id="email" name="email" [(ngModel)]="email" required
                    placeholder="admin@medconnect.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" [(ngModel)]="password" required
                    placeholder="••••••••">
            </div>

            <div class="form-actions">
                <button type="submit" [disabled]="!loginForm.form.valid">Login as Admin</button>
            </div>

            <div *ngIf="errorMessage" class="error-message">
                {{ errorMessage }}
            </div>
        </form>

        <div class="login-footer">
            <a routerLink="/login">Patient Login</a> | <a routerLink="/doctor-login">Doctor Login</a>
        </div>
    </div>
</div>
