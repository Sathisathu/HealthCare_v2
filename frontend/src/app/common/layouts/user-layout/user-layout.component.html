<header class="main-header">
    <div class="container header-content">
        <h1 class="logo" routerLink="/">MedConnect</h1>
        <nav class="main-nav">
            <!-- Pharmacy Specific Links -->
            <ng-container *ngIf="isPharmacy()">
                <a routerLink="/pharmacy" routerLinkActive="active" title="Pharmacy Store">
                    Pharmacy
                </a>
                <a routerLink="/cart" routerLinkActive="active" title="Cart">
                    Cart
                </a>
                <a routerLink="/orders" routerLinkActive="active" title="My Orders">
                    Orders
                </a>
            </ng-container>

            <!-- Consultation Specific Links -->
            <ng-container *ngIf="isConsultation()">
                <a routerLink="/consultation" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
                    title="Doctor List">
                    Doctors
                </a>
                <a routerLink="/consultation/my-appointments" routerLinkActive="active" title="My Consultations">
                    Appointments
                </a>
            </ng-container>

            <!-- Lab Test Specific Links -->
            <ng-container *ngIf="isLabTest()">
                <a routerLink="/lab-test" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
                    title="Test List">
                    Tests
                </a>
                <a routerLink="/lab-test/my-bookings" routerLinkActive="active" title="My Lab Tests">
                    My Bookings
                </a>
            </ng-container>

            <!-- Blood Donation Specific Links -->
            <ng-container *ngIf="isBloodDonation()">
                <!-- Single page module, no tabs needed -->
            </ng-container>

        </nav>

        <div class="user-profile" *ngIf="currentUser$ | async as user">
            <button class="logout-btn" (click)="logout()">Logout</button>
        </div>
    </div>
</header>

<main class="container">
    <router-outlet></router-outlet>
</main>

<footer class="main-footer">
    <div class="container">
        <p>&copy; 2026 MedConnect - Your Holistic Health Partner</p>
    </div>
</footer>
