<div class="container">
    <div class="header">
        <h1>Lab Tests & Scans</h1>
        <p>Premium diagnostic services delivered with precision and care.</p>
    </div>

    <div class="test-grid">
        <div *ngFor="let test of tests" class="test-card" [class]="test.testType">

            <div class="card-content">
                <h3>{{test.testName}}</h3>
                <p>{{test.description}}</p>
                <div class="card-footer">
                    <span class="price">Rs. {{test.price}}</span>
                    <button (click)="selectTest(test)" class="book-btn">Schedule Now</button>
                </div>
            </div>
        </div>
    </div>
</div>
