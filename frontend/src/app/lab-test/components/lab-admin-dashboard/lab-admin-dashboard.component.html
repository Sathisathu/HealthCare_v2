<div class="container">
    <div class="dash-grid">
        <!-- Section 1: Bookings Management -->
        <div class="section card">
            <h2>Patient Bookings 🏥</h2>
            <div class="booking-list">
                <div *ngFor="let booking of bookings" class="booking-item"
                    [class.selected]="selectedBooking?.id === booking.id">
                    <div class="info">
                        <strong>{{booking.patient?.name || 'User #' + booking.patient?.id}}</strong>
                        <p>{{booking.slot.testName}} - {{booking.slot.date | date:'shortDate'}}</p>
                    </div>
                    <div class="actions">
                        <span class="status-badge" [class]="booking.status">{{booking.status}}</span>
                        <button *ngIf="booking.status === 'BOOKED'" (click)="selectBooking(booking)"
                            class="action-btn">Enter Results</button>
                    </div>
                </div>
                <div *ngIf="bookings.length === 0" class="empty">No active bookings.</div>
            </div>
        </div>

        <!-- Section 2: Result Entry Form -->
        <div class="section card result-form-card" *ngIf="selectedBooking">
            <div class="form-header">
                <h2>Enter Results for {{selectedBooking.slot.testName}}</h2>
                <button (click)="selectedBooking = null" class="close">✕</button>
            </div>

            <div class="form-body">
                <div class="form-row" *ngFor="let param of resultForm.parameters; let i = index">
                    <input type="text" [(ngModel)]="param.name" placeholder="Parameter Name">
                    <input type="text" [(ngModel)]="param.value" placeholder="Result Value">
                    <input type="text" [(ngModel)]="param.range" placeholder="Normal Range">
                </div>
                <button (click)="addParameter()" class="add-btn">+ Add Field</button>

                <div class="remarks">
                    <label>Lab Remarks:</label>
                    <textarea [(ngModel)]="resultForm.remarks" placeholder="Type summary or remarks..."></textarea>
                </div>

                <button (click)="submitResult()" class="submit-btn">Submit & Complete Booking</button>
            </div>
        </div>
    </div>
</div>
