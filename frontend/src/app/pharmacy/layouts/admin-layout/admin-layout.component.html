<div class="admin-layout">
    <aside class="admin-sidebar">
        <div class="sidebar-header">
            <h1 class="logo" routerLink="/admin">Admin Panel</h1>
        </div>
        <nav class="sidebar-nav">
            <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                <span class="icon">📊</span> Inventory
            </a>
            <a routerLink="/admin/subscriptions" routerLinkActive="active">
                <span class="icon">✅</span> Approvals
            </a>

            <!-- Add more admin links here as we build them -->
            <a (click)="onLogout()" class="exit-link" style="cursor: pointer;">
                <span class="icon">🚪</span> Logout
            </a>
        </nav>
    </aside>

    <main class="admin-main">
        <header class="admin-topbar">
            <h2>MedConnect Pharmacy Management</h2>
            <div class="admin-user">
                <span>Administrator</span>
            </div>
        </header>
        <div class="admin-container">
            <router-outlet></router-outlet>
        </div>
    </main>
</div>
