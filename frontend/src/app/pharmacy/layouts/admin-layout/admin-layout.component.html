<div class="admin-layout">
    <aside class="admin-sidebar">
        <div class="sidebar-header">
            <h1 class="logo" routerLink="/admin">Admin Panel</h1>
        </div>
        <nav class="sidebar-nav">
            <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
                Inventory
            </a>
            <a routerLink="/admin/subscriptions" routerLinkActive="active">
                Approvals
            </a>
            <a routerLink="/admin/lab" routerLinkActive="active">
                Lab Mgmt
            </a>
            <a routerLink="/admin/blood-bank" routerLinkActive="active">
                Blood Bank
            </a>

            <!-- Add more admin links here as we build them -->
            <a (click)="onLogout()" class="exit-link" style="cursor: pointer;">
                Logout
            </a>
        </nav>
    </aside>

    <main class="admin-main">
        <header class="admin-topbar">
            <h2>MedConnect Admin Portal</h2>
            <div class="admin-user">
                <span>Administrator</span>
            </div>
        </header>
        <div class="admin-container">
            <router-outlet></router-outlet>
        </div>
    </main>
</div>
