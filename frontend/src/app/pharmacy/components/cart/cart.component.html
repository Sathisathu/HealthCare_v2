<div class="cart-container card">
    <div class="cart-header">
        <h2>Your Shopping Cart</h2>
        <p *ngIf="(cartItems$ | async) as items">{{items.length}} items in your cart</p>
    </div>

    <div *ngIf="(cartItems$ | async) as items">
        <div *ngIf="items.length === 0" class="empty-cart">
            <p>Your cart is empty.</p>
            <button class="btn-outline" routerLink="/">Go to Store</button>
        </div>

        <div class="cart-items-list">
            <div *ngFor="let item of items" class="cart-item">
                <div class="item-img">
                    <img [src]="item.product?.imageUrl" alt="">
                </div>
                <div class="item-details">
                    <h4>{{item.product?.name}}</h4>
                    <p>{{item.product?.category}}</p>
                </div>
                <div class="item-quantity">
                    <button (click)="updateQty(item.productId, item.quantity - 1)" class="qty-btn">-</button>
                    <input type="number" [value]="item.quantity" readonly>
                    <button (click)="updateQty(item.productId, item.quantity + 1)" class="qty-btn"
                        [disabled]="item.quantity >= (item.product?.stockQuantity || 0)">+</button>
                </div>
                <div class="item-price">
                    Rs. {{(item.product?.price || 0) * item.quantity}}
                </div>
                <button (click)="remove(item.productId)" class="remove-btn">
                    <span class="icon">×</span>
                </button>
            </div>
        </div>

        <div *ngIf="items.length > 0" class="cart-footer">
            <div class="total-section">
                <span class="label">Total Amount</span>
                <span class="value">Rs. {{getTotal()}}</span>
            </div>
            <button (click)="checkout()" class="btn-primary checkout-btn">Proceed to Checkout</button>
        </div>
    </div>
</div>
