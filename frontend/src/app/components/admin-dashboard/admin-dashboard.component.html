<div class="admin-wrapper card">
    <div class="admin-header">
        <h2>Inventory Management</h2>
        <button class="btn-primary" (click)="cancelEdit()" *ngIf="editingProduct">Add New Instead</button>
    </div>

    <div class="admin-content">
        <!-- Product Form -->
        <div class="product-form-section">
            <h3>{{ editingProduct ? 'Edit Medicine' : 'Register New Medicine' }}</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>Medicine Name</label>
                    <input class="input-field" [(ngModel)]="currentProduct.name" placeholder="Paracetamol">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <input class="input-field" [(ngModel)]="currentProduct.category" placeholder="Analgesics">
                </div>
                <div class="form-group">
                    <label>Price (Rs.)</label>
                    <input class="input-field" [(ngModel)]="currentProduct.price" type="number" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Stock Quantity</label>
                    <input class="input-field" [(ngModel)]="currentProduct.stockQuantity" type="number"
                        placeholder="100">
                </div>
                <div class="form-group">
                    <label>Dosage Form</label>
                    <input class="input-field" [(ngModel)]="currentProduct.dosageForm"
                        placeholder="Tablet, Syrup, etc.">
                </div>
                <div class="form-group">
                    <label>Strength</label>
                    <input class="input-field" [(ngModel)]="currentProduct.strength" placeholder="500mg, 10ml, etc.">
                </div>
                <div class="form-group">
                    <label>Pack Size</label>
                    <input class="input-field" [(ngModel)]="currentProduct.packSize"
                        placeholder="10 tablets, 100ml bottle">
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input class="input-field" [(ngModel)]="currentProduct.imageUrl" placeholder="HTTPS link">
                </div>
            </div>
            <div class="form-group full-width">
                <label>Description</label>
                <textarea class="input-field" [(ngModel)]="currentProduct.description"
                    placeholder="Describe the medicine..."></textarea>
            </div>
            <label class="checkbox-group">
                <input type="checkbox" [(ngModel)]="currentProduct.isPrescriptionRequired">
                Prescription Required (Rx)
            </label>
            <div class="form-actions">
                <button class="btn-primary" (click)="saveProduct()">{{ editingProduct ? 'Update Product' : 'Register
                    Product' }}</button>
                <button class="btn-outline" (click)="cancelEdit()">Reset Form</button>
            </div>
        </div>

        <!-- Inventory List -->
        <div class="inventory-list-section">
            <h3>Current Inventory</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Stock</th>
                            <th>Price</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let p of products">
                            <td>
                                <div class="item-cell">
                                    <strong>{{p.name}}</strong>
                                    <small>{{p.category}}</small>
                                </div>
                            </td>
                            <td>
                                <span [class.low-stock]="p.stockQuantity < 10">{{p.stockQuantity}}</span>
                            </td>
                            <td>Rs. {{p.price}}</td>
                            <td class="table-actions">
                                <button class="action-btn edit" (click)="editProduct(p)">✏️</button>
                                <button class="action-btn delete" (click)="deleteProduct(p.id!)">🗑️</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
